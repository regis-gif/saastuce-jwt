name: CI

# Deux jobs : `check` sur chaque push et pull request ; `publication` seulement sur un tag,
# après `check` — c'est là que JitPack construit la version que les backends récupéreront.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Résumé des tests
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = f = s = 0
          for p in glob.glob("build/test-results/test/TEST-*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); s += int(r.get("skipped", 0))
              f += int(r.get("failures", 0)) + int(r.get("errors", 0))
          print("## Tests\n")
          print(f"**{t - f - s}/{t}** passés, {f} en échec, {s} ignorés" if t else "_Pas de résultats de tests._")
          PY

  publication:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # JitPack construit à la première demande d'un artefact. On la fait ici plutôt que de la
      # laisser au premier build d'un backend, et on échoue si la construction échoue.
      - name: Faire construire la version par JitPack
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="https://jitpack.io/com/github/${GITHUB_REPOSITORY_OWNER}/saastuce-jwt/${tag}"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${base}/saastuce-jwt-${tag}.pom" || true)
            echo "[$i] ${code}"
            if [ "$code" = "200" ]; then
              echo "Publiée : \`com.github.${GITHUB_REPOSITORY_OWNER}:saastuce-jwt:${tag}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::JitPack n'a pas construit ${tag}. Journal : ${base}/build.log"
          curl -s --max-time 30 "${base}/build.log" | tail -40 || true
          exit 1
